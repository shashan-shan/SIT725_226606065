<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Two Numbers</title>
  <style>
    body { font-family: sans-serif; max-width: 400px; margin: 50px auto; }
    input, button { padding: 8px; margin: 5px 0; width: 100%; box-sizing: border-box; }
    #result { margin-top: 15px; font-size: 1.2em; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Add Two Numbers</h1>

  <input type="number" id="num1" placeholder="First number">
  <input type="number" id="num2" placeholder="Second number">
  <button id="addBtn">Add</button>

  <div id="result"></div>

  <script>
    document.getElementById('addBtn').addEventListener('click', async () => {
      const a = document.getElementById('num1').value;
      const b = document.getElementById('num2').value;
      const resultDiv = document.getElementById('result');

      try {
        const response = await fetch(`/add?a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`);
        const data = await response.json();

        if (!response.ok) {
          resultDiv.textContent = 'Error: ' + data.error;
        } else {
          resultDiv.textContent = `Result: ${data.result}`;
        }
      } catch (err) {
        resultDiv.textContent = 'Error: could not reach the server';
      }
    });
  </script>
</body>
</html>
