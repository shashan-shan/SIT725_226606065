<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>RecipeBox - SIT 725 Prac 3</title>
    <meta name="description" content="Recipe app for SIT 725 Prac 3">
    <meta property="og:title" content="RecipeBox">
    <meta property="og:type" content="website">
    <meta property="og:description" content="Recipe app for SIT 725 Prac 3">

    <!-- Compiled and minified CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>
    <nav>
        <div class="nav-wrapper navbar-size">
            <a href="#" class="brand-logo"><img src="images/chef-logo.png" alt="Chef logo"> RecipeBox</a>
            <ul id="nav-mobile" class="right hide-on-med-and-down">
                <li><a target="_blank" href="https://github.com/">GitHub</a></li>
            </ul>
        </div>
    </nav>

    <main class="main-body">
        <div class="container">
            <div class="row">
                <div class="col s12 center-align">
                    <h1 id="heading">What's Cooking?</h1>
                    <p class="flow-text">A simple recipe app built with Express and Materialize. Browse recipes loaded from our REST API, or share one of your own.</p>
                </div>
                <div class="col s12 center-align">
                    <img class="materialboxed materialboxed-image" src="images/kitchen-hero.jpg" alt="Kitchen">
                </div>
                <div class="col s12 center-align">
                    <a class="waves-effect waves-light btn add-recipe-button modal-trigger" data-target="modal1">
                        <i class="material-icons left">restaurant_menu</i>Add Recipe
                    </a>
                </div>
            </div>

            <!-- Recipe cards are added here dynamically from /api/recipes -->
            <div class="row" id="card-section"></div>
        </div>

        <!-- Modal Structure -->
        <div id="modal1" class="modal modal-fixed-footer">
            <div class="row modal-content">
                <h4 class="modal-heading">Share a Recipe</h4>
                <form class="col s12">
                    <div class="row">
                        <div class="input-field col s6">
                            <input id="recipe_title" type="text" class="validate">
                            <label for="recipe_title">Recipe Name</label>
                        </div>
                        <div class="input-field col s6">
                            <input id="cook_time" type="number" class="validate">
                            <label for="cook_time">Cook Time (mins)</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <input id="recipe_image" type="text" class="validate">
                            <label for="recipe_image">Image URL</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12">
                            <textarea id="recipe_description" class="materialize-textarea"></textarea>
                            <label for="recipe_description">Description</label>
                        </div>
                    </div>
                    <div class="row">
                        <div class="input-field col s12 center-align">
                            <a class="waves-effect waves-light btn" id="formSubmit">Submit</a>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <!-- Compiled and minified JavaScript -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
    <script src="js/scripts.js"></script>
</body>
</html>
